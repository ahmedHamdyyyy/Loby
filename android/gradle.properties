org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true

# Workaround Kotlin daemon connection issues on some Windows setups
# Falls back to in-process compilation to avoid socket/AV conflicts
kotlin.compiler.execution.strategy=in-process

# Give Kotlin compiler more heap to reduce OOM/instability
kotlin.daemon.jvmargs=-Xms256m -Xmx2048m -XX:MaxMetaspaceSize=512m
